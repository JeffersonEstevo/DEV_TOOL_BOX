<div class="tool-container">
    <header class="tool-header">
        <h2>Temporizador Pomodoro</h2>
        <p>Aumente sua produtividade alternando ciclos de foco intenso com pausas revigorantes.</p>
    </header>

    <!-- Abas de Modos do Pomodoro -->
    <div class="data-hora-tabs pomodoro-tabs">
        <button class="tab-btn active" onclick="mudarModoPomodoro('foco')">
            <i class="bi bi-bullseye"></i> Foco
        </button>
        <button class="tab-btn" onclick="mudarModoPomodoro('pausaCurta')">
            <i class="bi bi-cup-hot-fill"></i> Pausa Curta
        </button>
        <button class="tab-btn" onclick="mudarModoPomodoro('pausaLonga')">
            <i class="bi bi-moon-stars-fill"></i> Pausa Longa
        </button>
    </div>

    <div class="generator-workspace dh-workspace active" style="text-align: center;">
        <!-- Visor do Pomodoro -->
        <div class="chrono-display-wrapper pomodoro-display-box">
            <span id="pomo-display" class="chrono-time">25:00</span>
            <small id="pomo-status-label" class="field-help" style="display: block; margin-top: 0.5rem; font-weight: 600;">Hora de focar!</small>
        </div>

        <!-- Ações do Pomodoro -->
        <div class="chrono-actions">
            <button id="btn-pomo-start" class="chrono-btn btn-start" onclick="alternarPomodoro()">
                <i class="bi bi-play-fill"></i> Iniciar
            </button>
            <button id="btn-pomo-reset" class="chrono-btn btn-reset" onclick="reiniciarPomodoro()">
                <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
            </button>
        </div>

        <!-- Estatísticas da Sessão -->
        <div class="chrono-laps-container" style="text-align: center;">
            <h5><i class="bi bi-check2-circle"></i> Ciclos Concluídos</h5>
            <div class="pomo-stats">
                <span id="pomo-counter">0</span> ciclos completados hoje
            </div>
        </div>
    </div>

    <!-- Botão de Configurações do Pomodoro -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem;">
        <button class="chrono-btn" onclick="abrirConfigPomodoro()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; background-color: var(--bg-sidebar); color: var(--text-main); border: 1px solid var(--border-color);">
            <i class="bi bi-gear-fill"></i> Configurar Tempos
        </button>
    </div>

    <!-- Modal / Painel de Configuração de Tempos -->
    <div id="pomo-settings-modal" style="display: none; background: var(--bg-sidebar); border: 2px solid var(--border-color); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; text-align: left;">
        <h5 style="margin-top: 0; margin-bottom: 1rem; color: var(--text-main); display: flex; align-items: center; gap: 0.4rem;">
            <i class="bi bi-sliders"></i> Personalizar Duração (Minutos)
        </h5>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 0.3rem;">Foco</label>
                <input type="number" id="input-time-foco" min="1" max="120" value="25" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: calc(var(--radius) - 2px); background: var(--bg-main); color: var(--text-main);">
            </div>
            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 0.3rem;">Pausa Curta</label>
                <input type="number" id="input-time-curta" min="1" max="30" value="5" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: calc(var(--radius) - 2px); background: var(--bg-main); color: var(--text-main);">
            </div>
            <div>
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-main); display: block; margin-bottom: 0.3rem;">Pausa Longa</label>
                <input type="number" id="input-time-longa" min="1" max="60" value="15" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: calc(var(--radius) - 2px); background: var(--bg-main); color: var(--text-main);">
            </div>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
            <button class="chrono-btn" onclick="fecharConfigPomodoro()" style="background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 0.4rem 1rem;">Cancelar</button>
            <button class="chrono-btn btn-start" onclick="salvarConfigPomodoro()" style="padding: 0.4rem 1rem;">Salvar</button>
        </div>
    </div>
</div>

<script src="static/js/data_hora/pomodoro.js"></script>
