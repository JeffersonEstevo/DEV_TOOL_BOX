<div class="tool-container">
    <header class="tool-header">
        <h2>Calculadora de Frações</h2>
        <p>Realize operações com duas ou mais frações, com redução automática ao menor denominador comum.</p>
    </header>

    <!-- Container dinâmico para as frações e operadores -->
    <div id="fraction-container" class="fraction-workspace">
        <!-- Bloco da Fração 1 -->
        <div class="fraction-block" data-index="1">
            <div class="field-group">
                <input type="number" class="numerator" placeholder="Numerador 1" aria-label="Numerador 1">
            </div>
            <div class="fraction-line"></div>
            <div class="field-group">
                <input type="number" class="denominator" placeholder="Denominador 1" aria-label="Denominador 1">
            </div>
        </div>

        <!-- Bloco padrão inicial (Operador + Fração 2) -->
        <div class="fraction-operator-block">
            <div class="fraction-operator">
                <select class="operation-select" aria-label="Operação Matemática">
                    <option value="add">+</option>
                    <option value="subtract">−</option>
                    <option value="multiply">×</option>
                    <option value="divide">÷</option>
                </select>
            </div>
        </div>

        <div class="fraction-block" data-index="2">
            <div class="field-group">
                <input type="number" class="numerator" placeholder="Numerador 2" aria-label="Numerador 2">
            </div>
            <div class="fraction-line"></div>
            <div class="field-group">
                <input type="number" class="denominator" placeholder="Denominador 2" aria-label="Denominador 2">
            </div>
        </div>
    </div>

    <!-- Botões para gerenciar a quantidade de frações -->
    <div class="fraction-controls-bar text-center mb-3">
        <button id="add-fraction-field" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-plus-circle"></i> Adicionar Fração
        </button>
        <button id="remove-fraction-field" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-dash-circle"></i> Remover Fração
        </button>
    </div>

    <div class="action-bar text-center">
        <button id="calc-fraction-button" class="btn btn-primary">
            <i class="bi bi-calculator"></i> Calcular Fração
        </button>
        <button id="clean-fraction-button" class="btn btn-secondary">Limpar</button>
    </div>

    <div class="tool-grid mt-4">
        <div class="result-card text-center-card">
            <div class="card-header">Resultado em Fração</div>
            <div class="card-body container-center" id="fraction-result">
                <span class="text-muted">Aguardando dados...</span>
            </div>
        </div>

        <div class="result-card text-center-card">
            <div class="card-header">Resultado em Decimal</div>
            <div class="card-body container-center" id="decimal-result">
                <span class="text-muted">Aguardando dados...</span>
            </div>
        </div>
    </div>
</div>

<script src="static/js/calculadoras/fracao.js"></script>
